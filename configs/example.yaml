# Copy to configs/local.yaml (gitignored) and edit for this machine.
# Fill in the ports with `uv run so101-find-ports` (it writes configs/local.yaml;
# pyserial lists macOS ports as /dev/cu.usbmodem*; LeRobot accepts tty.* too).
# Check cameras with `uv run so101-doctor` (lerobot-find-cameras opens every index).

arms:
  leader:
    id: main                         # matches hardware/calibration/leader/main.json
    port: /dev/cu.usbmodem0000000001
  follower:
    id: main                         # matches hardware/calibration/follower/main.json
    port: /dev/cu.usbmodem0000000002

cameras:
  front:
    index: 0
    width: 640
    height: 480
    fps: 30
  wrist:
    index: 1
    width: 640
    height: 480
    fps: 30
