# Copy to configs/local.yaml (gitignored) and edit for this machine.
# Find ports with `lerobot-find-port` and cameras with `lerobot-find-cameras`.

arms:
  leader:
    id: main                         # matches hardware/calibration/leader/main.json
    port: /dev/tty.usbmodem0000000001
  follower:
    id: main                         # matches hardware/calibration/follower/main.json
    port: /dev/tty.usbmodem0000000002

cameras:
  front:
    index: 0
    width: 640
    height: 480
    fps: 30
  wrist:
    index: 1
    width: 640
    height: 480
    fps: 30
