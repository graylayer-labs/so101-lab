[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so101"
version = "0.1.0"
description = "Shared SO-101 arm code: joint names, arm config and calibration loading"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Eoin McAllister" }]
dependencies = [
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/so101"]
