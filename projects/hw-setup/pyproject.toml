
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hw-setup"
version = "0.1.0"
description = "Hardware setup: find ports, set motor IDs and calibrate the SO-101 arms with LeRobot"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Eoin McAllister" }]
dependencies = [
    "lerobot[dataset,feetech]==0.6.1",
    "pyserial>=3.5",
    "so101",
]

[project.scripts]
so101-calibrate = "hw_setup.calibrate:cli"
so101-find-ports = "hw_setup.find_ports:main"
so101-setup-motors = "hw_setup.setup_motors:cli"
so101-teleop = "hw_setup.teleop:cli"

[tool.uv.sources]
so101 = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/hw_setup"]
