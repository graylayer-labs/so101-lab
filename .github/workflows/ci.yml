name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Calls a local reusable workflow so the check reports as "checks / checks",
  # like the org repos. The org's shared ci-python.yml cannot be used yet: it
  # hard-codes `uv sync --dev --locked` (no --all-packages), so the workspace
  # members (projects/hw-setup and its lerobot dependency) would not be installed.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
